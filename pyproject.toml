[project]
name = "models-initial-course"
version = "0.1.0"
description = "W&B Models introductory course"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "wandb[media]>=0.19.0",
    "python-dotenv>=1.0.0",
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
    "pillow>=10.0.0",
    "pandas>=2.0.0",
    "plotly>=5.20.0",
    "moviepy>=1.0.3",
    "imageio>=2.31.0",
    "imageio-ffmpeg>=0.4.9",
]

[project.optional-dependencies]
hf = ["torch>=2.0.0", "transformers>=4.40.0,<5", "accelerate>=0.26.0"]
vision = ["fastai>=2.8.0,<3", "torchvision>=0.16.0"]
test = ["nbformat>=5.10.0", "nbclient>=0.10.0", "ipykernel>=6.0.0"]
notebook = ["jupyterlab>=4.0.0"]
all = ["models-initial-course[hf,vision,test,notebook]"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["course_utils"]
